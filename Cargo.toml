[workspace]
resolver = "2"
members = ["crates/zafe-core"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zafe/zafe"

# Security-critical crates are pinned exactly (spec §4.4). Bumps require review.
[workspace.dependencies]
reddsa = { version = "=0.5.2", default-features = false, features = ["std", "frost", "serde"] }
frost-rerandomized = { version = "=3.0.0", features = ["serde"] }
orchard = { version = "=0.15.5", default-features = false, features = ["std", "circuit", "multicore"] }
pczt = { version = "=0.9.3", features = ["orchard", "signer", "prover", "io-finalizer", "spend-finalizer", "tx-extractor"] }
zcash_primitives = "=0.30.1"
zcash_protocol = "0.10"
zcash_keys = { version = "=0.16.1", features = ["orchard", "unstable-frost"] }
zcash_client_backend = { version = "=0.24.0", features = ["orchard", "pczt", "lightwalletd-tonic"] }
# zcash_client_backend/pczt enables transparent-inputs; sqlite must enable it too or it fails to compile.
zcash_client_sqlite = { version = "=0.22.0", features = ["orchard", "transparent-inputs"] }

zcash_spec = "=0.2.1"
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
blake2b_simd = "1"
blake3 = "1"
rand = "0.8"
rand_core = "0.6"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
serde_json = "1"
